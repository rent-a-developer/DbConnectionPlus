name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not just the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could this work? C# sketches welcome.
      render: csharp
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where would this live?
      options:
        - The core library (applies to every database)
        - One database adapter
        - All five database adapters (a change to the adapter seam)
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What do you do today instead, and why is it not good enough?
