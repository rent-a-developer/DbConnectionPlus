version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # The five vendor ADO.NET drivers. They are independent of each other, but a driver bump is always
      # reviewed the same way - run that adapter's integration tests - so one PR per week beats five.
      database-drivers:
        patterns:
          - "Microsoft.Data.SqlClient"
          - "Microsoft.Data.Sqlite*"
          - "MySqlConnector"
          - "Npgsql"
          - "Oracle.ManagedDataAccess*"
      # Analyzers only ever change what the build rejects, never what ships. Grouping them keeps a week's
      # worth of new diagnostics in one PR instead of one per analyzer package.
      analyzers:
        patterns:
          - "ErrorProne.NET.*"
          - "Microsoft.CodeAnalysis.PublicApiAnalyzers"
          - "Roslynator.*"
          - "NSubstitute.Analyzers.*"
      # The test stack. A bump here can never affect a consumer.
      test-stack:
        patterns:
          - "AutoFixture*"
          - "AwesomeAssertions"
          - "Bogus"
          - "coverlet.*"
          - "Mapster"
          - "NSubstitute"
          - "NSubstitute.Community.*"
          - "xunit*"
    ignore:
      # AutoFixture.AutoNSubstitute 4.18.1 requires NSubstitute [2.0.3, 6.0.0). Remove this once
      # AutoFixture 5.0.0 ships as a stable release (5.0.0-rc.1 is a pre-release).
      - dependency-name: "NSubstitute"
        versions: [ ">=6.0.0" ]
        
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      # Keep CodeQL action variants in sync since they're released together
      codeql:
        patterns:
          - "github/codeql-action/*"
