# Dependabot configuration.
#
# This file governs VERSION updates only - the routine "a new version exists" pull requests. Dependabot
# SECURITY updates are a separate, repository-level setting and are deliberately left enabled and immediate:
# the quarterly cadence below is about noise, and a published advisory is not noise. `NuGetAudit` in
# Directory.Build.props reports the same advisories in every local build and in CI, so a vulnerable
# transitive package is visible long before a pull request arrives.
#
# Quarterly rather than monthly because these dependencies move faster than this repository needs them to.
# A grouped quarterly pull request is reviewed; twelve monthly ones are skimmed.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: quarterly
    commit-message:
      # Conventional Commits, so a Dependabot branch reads like every other commit in the history and the
      # changelog tooling does not have to special-case it. `build:` is right for a dependency that ships,
      # `chore:` for one that only the build or the tests see.
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      # The vendor ADO.NET drivers. They are independent of each other, but a driver bump is always
      # reviewed the same way - run that adapter's integration tests - so one pull request beats one per driver.
      #
      # Minor and patch only: a major version of a driver is a breaking change for the adapter that wraps it,
      # and it deserves its own pull request with its own integration run.
      database-drivers:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "Microsoft.Data.SqlClient"
          - "Microsoft.Data.Sqlite*"
          - "MySqlConnector"
          - "Npgsql"
          - "Oracle.ManagedDataAccess*"
      # Analyzers and the formatter. They only ever change what the build REJECTS, never what ships, so a
      # group of them is one review of "what does the build complain about now" instead of one per package.
      #
      # CSharpier.MsBuild is in this group and needs a companion edit every time: the csharpier entry in
      # .config/dotnet-tools.json has to move with it, or the build demands formatting the tool does not
      # produce. Dependabot cannot make that edit.
      analyzers-and-formatters:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "CSharpier.MsBuild"
          - "ErrorProne.NET.*"
          - "Microsoft.CodeAnalysis.PublicApiAnalyzers"
          - "NewStyleCop.Analyzers"
          - "NSubstitute.Analyzers.*"
          - "Roslynator.*"
          - "SonarAnalyzer.CSharp"
      # The test stack. A bump here can never affect a consumer: none of these packages is referenced by a
      # shipping project or appears in any package's dependency graph.
      test-stack:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "AutoFixture*"
          - "AwesomeAssertions"
          - "Bogus"
          - "coverlet.*"
          - "Mapster"
          - "NSubstitute"
          - "NSubstitute.Community.*"
          - "RentADeveloper.ArgumentNullGuards"
          - "System.Linq.AsyncEnumerable"
          - "Testcontainers.*"
          - "xunit*"
      # Coupled families, at EVERY update type including major. These are packages that are versioned and
      # released together and that will not resolve against each other across a major boundary, so splitting
      # a major across pull requests produces a branch that cannot restore.
      autofixture:
        applies-to: version-updates
        patterns:
          - "AutoFixture*"
      testcontainers:
        applies-to: version-updates
        patterns:
          - "Testcontainers.*"
      xunit:
        applies-to: version-updates
        patterns:
          - "xunit*"
    ignore:
      # AutoFixture.AutoNSubstitute 4.18.1 requires NSubstitute [2.0.3, 6.0.0) - verified against the
      # package's own nuspec, not assumed. Remove this once AutoFixture 5.0.0 ships as a stable release
      # (5.0.0-rc.1 is a pre-release), and check the constraint again before you do.
      - dependency-name: "NSubstitute"
        versions: [ ">=6.0.0" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The CodeQL actions are released together and their versions have to match, so they move together at
      # every update type - including major.
      codeql:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
